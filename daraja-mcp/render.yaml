services:
  - type: web
    name: daraja-mcp
    runtime: node
    plan: free # no persistent disk needed now that Firestore holds the data
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DARAJA_ENV
        value: production
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_PASSKEY
        sync: false
      - key: DARAJA_TILL_NUMBER
        sync: false
      - key: DARAJA_STK_TRANSACTION_TYPE
        value: CustomerBuyGoodsOnline
      - key: DARAJA_INITIATOR_NAME
        sync: false
      - key: DARAJA_INITIATOR_PASSWORD
        sync: false
      - key: DARAJA_CERT_PATH
        value: /etc/secrets/production.cer # uploaded via Render's "Secret Files" tab, not the repo
      - key: CALLBACK_BASE_URL
        sync: false # set to your Render URL, e.g. https://daraja-mcp.onrender.com
      - key: MAX_TRANSACTION_AMOUNT
        value: "5000"
      - key: MAX_DAILY_AMOUNT
        value: "20000"
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-service-account.json # uploaded via Render's "Secret Files" tab
      - key: MCP_BEARER_TOKEN
        sync: false # generate with `openssl rand -hex 32`
